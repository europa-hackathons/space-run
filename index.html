<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#04050d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Space Run</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div id="hud" class="hidden">
        <div class="hud-item"><span class="label" data-i18n="score">SCORE</span><span id="hud-score">0</span></div>
        <div class="hud-item"><span class="label" data-i18n="time">TIME</span><span id="hud-time">90</span></div>
        <div class="hud-item"><span class="label" data-i18n="lives">LIVES</span><span id="hud-lives"></span></div>
      </div>

      <div id="touch" class="hidden">
        <div class="touch-group">
          <button class="touch-btn" id="btn-left" aria-label="Move left">◀</button>
          <button class="touch-btn" id="btn-right" aria-label="Move right">▶</button>
        </div>
        <button class="touch-btn fire" id="btn-fire" aria-label="Fire" data-i18n="fire">FIRE</button>
      </div>

      <div id="screen-start" class="screen">
        <h1>SPACE RUN</h1>
        <p class="sub" data-i18n="tagline">Dodge the asteroids. Shoot the aliens. Survive 90 seconds.</p>

        <div class="mode btn-only">
          <p class="keys kb-only" data-i18n="keysKeyboard"></p>
          <p class="keys touch-only" data-i18n="keysTouch"></p>
          <button class="cta" data-confirm>
            <span class="kb-only" data-i18n="startKeyboard">Press Enter to start</span><span class="touch-only" data-i18n="startTouch">Tap to start</span>
          </button>
          <button class="cta secondary" id="btn-camera" data-i18n="playWithCamera">Play with camera</button>
          <p class="sub" id="camera-status" role="status"></p>
        </div>

        <div class="mode cam-only">
          <ul class="moves">
            <li data-i18n="moveSteer"></li>
            <li data-i18n="moveFire"></li>
            <li data-i18n="moveStart"></li>
          </ul>
          <p class="big-hint" data-i18n="handsToStart"></p>
          <label class="option"><input type="checkbox" id="opt-autofire" /> <span data-i18n="autoFire">Auto-fire (just steer)</span></label>
          <button class="cta secondary" id="btn-buttons" data-i18n="useButtons">Use buttons instead</button>
        </div>
      </div>

      <div id="screen-results" class="screen hidden">
        <h1 id="results-title">ROUND OVER</h1>
        <p class="big"><span class="label" data-i18n="score">SCORE</span> <span id="results-score">0</span></p>
        <p class="sub"><span class="label" data-i18n="best">BEST</span> <span id="results-best">0</span> <span id="results-new" class="hidden" data-i18n="newBest">· new best!</span></p>
        <button class="cta btn-only" data-confirm>
          <span class="kb-only" data-i18n="againKeyboard">Press Enter to play again</span><span class="touch-only" data-i18n="againTouch">Tap to play again</span>
        </button>
        <p class="big-hint cam-only" data-i18n="handsToRestart"></p>
      </div>

      <div id="paused" class="screen hidden">
        <h1 data-i18n="pausedTitle">WHERE DID YOU GO?</h1>
        <p class="big-hint" data-i18n="pausedHint"></p>
      </div>

      <div class="corner">
        <button id="btn-mute" class="lang" aria-label="Sound on or off">🔊</button>
        <button id="btn-language" class="lang" data-i18n="switchLanguage">🇸🇪 Svenska</button>
      </div>

      <canvas id="cam-preview" class="hidden" aria-label="Camera view"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
